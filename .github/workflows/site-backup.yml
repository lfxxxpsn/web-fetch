name: Site HTML backup batch

on:
  workflow_dispatch:
    inputs:
      previous_catalog:
        description: "Latest verified inventory or site-batch Release tag"
        type: string
        required: true
      category:
        description: "Page category to capture"
        type: choice
        default: "all"
        options: ["all", "entry", "race", "result", "local_race", "horse", "jockey", "article", "analysis", "pedigree", "chart", "race_history"]
      limit:
        description: "Maximum HTML requests per run (1–100)"
        type: number
        default: 20
      mode:
        description: "Backfill, refresh, or retry pages awaiting validation"
        type: choice
        default: "backfill"
        options: ["backfill", "refresh", "retry_validation"]
      min_age_hours:
        description: "Refresh mode only: minimum hours since the last check"
        type: number
        default: 24
      race_year:
        description: "Optional year for completed race and official result pages, e.g. 2026"
        type: string
        default: ""

      batches:
        description: "Maximum consecutive yearly backfill batches (1–100)"
        type: number
        default: 1
      skip_race_day:
        description: "Optional race date to leave pending, YYYY-MM-DD"
        type: string
        default: ""
      race_backup:
        description: "Optional race-day Release tag to include in the first batch"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: web-page-fetch-test
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      result: ${{ steps.batch.outputs.result }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      has_more: ${{ steps.batch.outputs.has_more }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Download the preceding verified catalog
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PREVIOUS: ${{ inputs.previous_catalog }}
          RACE_BACKUP: ${{ inputs.race_backup }}
        run: |
          [[ "$PREVIOUS" =~ ^(inventory|site-batch)-[0-9]+-[0-9]+$ ]]
          gh release download "$PREVIOUS" --pattern 'catalog.zip*' --dir previous
          if [[ -n "$RACE_BACKUP" ]]; then
            [[ "$RACE_BACKUP" =~ ^pilot-[0-9]+-[0-9]+$ ]]
            gh release download "$RACE_BACKUP" --pattern 'batch.zip*' --dir race-backup
          fi
      - name: Capture selected HTML
        id: batch
        shell: bash
        env:
          TARGET_URL: ${{ secrets.TARGET_URL }}
          CATEGORY: ${{ inputs.category }}
          LIMIT: ${{ inputs.limit }}
          MODE: ${{ inputs.mode }}
          MIN_AGE: ${{ inputs.min_age_hours }}
          RACE_YEAR: ${{ inputs.race_year }}
          BATCHES: ${{ inputs.batches }}
          SKIP_RACE_DAY: ${{ inputs.skip_race_day }}
          RACE_BACKUP: ${{ inputs.race_backup }}
        run: |
          [[ "$BATCHES" =~ ^([1-9]|[1-9][0-9]|100)$ ]]
          if (( BATCHES > 1 )); then
            [[ "$MODE" == backfill && -n "$RACE_YEAR" ]]
          fi
          args=()
          case "$MODE" in
            backfill) ;;
            refresh) args+=(--refresh-hours "$MIN_AGE") ;;
            retry_validation) args+=(--retry-validation) ;;
            *) exit 2 ;;
          esac
          if [[ -n "$RACE_YEAR" ]]; then
            args+=(--race-year "$RACE_YEAR")
          fi
          if [[ -n "$SKIP_RACE_DAY" ]]; then
            args+=(--skip-race-day "$SKIP_RACE_DAY")
          fi
          if [[ -n "$RACE_BACKUP" ]]; then
            args+=(--race-backup "$RACE_BACKUP" race-backup/batch.zip)
          fi
          code=0
          python site_capture.py --previous previous/catalog.zip --output backup \
            --tag "site-batch-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --category "$CATEGORY" --limit "$LIMIT" "${args[@]}" || code=$?
          for file in catalog.zip catalog.zip.sha256 pages.zip pages.zip.sha256; do
            test -s "backup/$file"
          done
          has_more=$(python -c 'import json; print(str(json.load(open("backup/inventory.json"))["last_batch"].get("has_more", False)).lower())')
          printf 'result=%s\nhas_more=%s\n' "$code" "$has_more" >> "$GITHUB_OUTPUT"
          jq -r '.last_batch | [
            "### Backup progress",
            "",
            "**Saved** \(.progress.saved) · **Pending** \(.progress.pending) · **Needs review** \(.progress.validation_pending) · **Unavailable** \(.progress.missing)",
            "",
            "Pages deferred during this batch \(.validation_pending | length)"
          ][]' backup/inventory.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        id: upload
        with:
          name: site-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            backup/catalog.zip
            backup/catalog.zip.sha256
            backup/pages.zip
            backup/pages.zip.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: capture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      checkpoint: ${{ steps.release.outputs.checkpoint }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.capture.outputs.artifact_id }}
          path: backup
      - name: Verify and publish the page archives and updated catalog
        id: release
        shell: bash
        working-directory: backup
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BATCH_STATUS: ${{ needs.capture.outputs.result }}
        run: |
          sha256sum --check catalog.zip.sha256 pages.zip.sha256
          unzip -qt catalog.zip
          unzip -qt pages.zip
          tag="site-batch-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          notes="$RUNNER_TEMP/site-backup-notes.md"
          cat > "$notes" <<EOF
          The catalog locates all backed-up versions. This pages ZIP contains only new HTML.

          Workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          gh release create "$tag" catalog.zip catalog.zip.sha256 pages.zip pages.zip.sha256 \
            --target "$GITHUB_SHA" --title "Site HTML backup: ${GITHUB_RUN_ID}" \
            --notes-file "$notes" --draft --latest=false
          gh release edit "$tag" --draft=false --latest=false
          printf '[Backup Release](%s/%s/releases/tag/%s)\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$tag" >> "$GITHUB_STEP_SUMMARY"
          test "$BATCH_STATUS" = 0
          printf 'checkpoint=%s\n' "$tag" >> "$GITHUB_OUTPUT"

  continue_backfill:
    needs: [capture, publish]
    if: ${{ success() && inputs.batches > 1 && needs.capture.outputs.has_more == 'true' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Continue from the published checkpoint
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CHECKPOINT: ${{ needs.publish.outputs.checkpoint }}
          CATEGORY: ${{ inputs.category }}
          LIMIT: ${{ inputs.limit }}
          RACE_YEAR: ${{ inputs.race_year }}
          BATCHES: ${{ inputs.batches }}
          SKIP_RACE_DAY: ${{ inputs.skip_race_day }}
        run: |
          [[ "$CHECKPOINT" =~ ^site-batch-[0-9]+-[0-9]+$ ]]
          next_run=$(gh workflow run site-backup.yml --ref "$CHECKPOINT" \
            -f previous_catalog="$CHECKPOINT" -f category="$CATEGORY" \
            -f limit="$LIMIT" -f mode=backfill -f race_year="$RACE_YEAR" \
            -f batches="$(( BATCHES - 1 ))" -f skip_race_day="$SKIP_RACE_DAY")
          printf 'Published checkpoint: `%s`\n\nNext run: %s\n' "$CHECKPOINT" "$next_run" >> "$GITHUB_STEP_SUMMARY"
