name: Race batch pilot

on:
  workflow_dispatch:
    inputs:
      race_day:
        description: "Completed race date (YYYY-MM-DD)"
        required: true
        type: string
      mode:
        description: "Keep the three-race pilot, list a full day, or capture up to ten races"
        type: choice
        default: "pilot"
        options: ["pilot", "day-list", "race-day"]
      pause_after:
        description: "Pilot mode only: maximum new HTML pages"
        type: choice
        default: "6"
        options: ["1", "2", "3", "4", "5", "6"]
      resume_run_id:
        description: "Actions run ID of an intermediate checkpoint"
        type: string
        default: ""
      resume_tag:
        description: "Release tag of a published checkpoint (instead of a run ID)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: web-page-fetch-test
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      result: ${{ steps.batch.outputs.result }}
      publish: ${{ steps.batch.outputs.publish }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Download the previous pilot checkpoint
        if: ${{ inputs.resume_run_id != '' || inputs.resume_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
          RESUME_TAG: ${{ inputs.resume_tag }}
        shell: bash
        run: |
          if [[ -n "$RESUME_RUN_ID" && -n "$RESUME_TAG" ]]; then
            echo '::error::Use either resume_run_id or resume_tag.'
            exit 2
          fi
          if [[ -n "$RESUME_TAG" ]]; then
            [[ "$RESUME_TAG" =~ ^pilot-[0-9]+-[0-9]+$ ]]
            gh release download "$RESUME_TAG" \
              --pattern batch.zip --pattern batch.zip.sha256 --dir previous
          else
            [[ "$RESUME_RUN_ID" =~ ^[0-9]+$ ]]
            attempt=$(gh run view "$RESUME_RUN_ID" --json status,attempt \
              --jq 'select(.status == "completed") | .attempt')
            if [[ ! "$attempt" =~ ^[0-9]+$ ]]; then
              echo '::error::The checkpoint run must be completed.'
              exit 1
            fi
            artifact="race-pilot-$RESUME_RUN_ID-$attempt"
            gh run download "$RESUME_RUN_ID" --name "$artifact" --dir previous
          fi
          test -s previous/batch.zip
          test -s previous/batch.zip.sha256
      - name: Save selected race pages and linked results
        id: batch
        env:
          TARGET_URL: ${{ secrets.TARGET_URL }}
          RACE_DAY: ${{ inputs.race_day }}
          MODE: ${{ inputs.mode }}
          PAUSE_AFTER: ${{ inputs.pause_after }}
        shell: bash
        run: |
          args=(--day "$RACE_DAY" --pause-after "$PAUSE_AFTER" --output pilot)
          case "$MODE" in
            pilot) ;;
            day-list) args+=(--full-day --list-only) ;;
            race-day) args+=(--full-day) ;;
            *) exit 2 ;;
          esac
          if [[ -f previous/batch.zip ]]; then
            args+=(--resume previous/batch.zip)
          fi
          code=0
          python batch_capture.py "${args[@]}" || code=$?
          test -s pilot/batch.zip
          test -s pilot/batch.zip.sha256
          state=$(python -c 'import json; print(json.load(open("pilot/checkpoint.json"))["state"])')
          publish=false
          case "$state" in
            forbidden|rate_limited) publish=true ;;
            complete|complete_with_missing)
              if [[ "$MODE" == race-day ]]; then publish=true; fi ;;
          esac
          printf 'result=%s\npublish=%s\n' "$code" "$publish" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        id: upload
        with:
          name: race-pilot-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            pilot/batch.zip
            pilot/batch.zip.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Report a failed capture after saving the checkpoint
        if: ${{ steps.batch.outputs.result != '0' && steps.batch.outputs.publish != 'true' }}
        run: exit 1

  publish:
    needs: capture
    if: ${{ needs.capture.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.capture.outputs.artifact_id }}
          path: pilot
      - name: Publish the checkpoint and report the batch result
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PILOT_STATUS: ${{ needs.capture.outputs.result }}
        working-directory: pilot
        shell: bash
        run: |
          sha256sum --check batch.zip.sha256
          tag="pilot-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          notes="$RUNNER_TEMP/pilot-notes.md"
          cat > "$notes" <<EOF
          Race and official result HTML verified so far, plus the resumable checkpoint.

          Workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          gh release create "$tag" batch.zip batch.zip.sha256 \
            --target "$GITHUB_SHA" --title "Race batch backup: ${GITHUB_RUN_ID}" \
            --notes-file "$notes" --draft --latest=false
          gh release edit "$tag" --draft=false --latest=false
          test "$PILOT_STATUS" = 0
